<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2C" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="1.5" fill="none" />

  <!-- Data Analyst Bar Chart -->
  <rect x="14" y="36" width="7" height="14" rx="2.5" fill="url(#barGrad)" opacity="0.6" />
  <rect x="25.5" y="28" width="7" height="22" rx="2.5" fill="url(#barGrad)" opacity="0.85" />
  <rect x="37" y="20" width="7" height="30" rx="2.5" fill="url(#barGrad)" />

  <!-- Trending Analytics Line -->
  <path d="M12 40 L24 30 L35 24 L50 14" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="50" cy="14" r="3.5" fill="#FBBF24" />

  <!-- AI Sparkle Icon -->
  <path d="M46 10 C46 14 44 16 40 16 C44 16 46 18 46 22 C46 18 48 16 52 16 C48 16 46 14 46 10 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
</svg>